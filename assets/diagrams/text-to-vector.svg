<svg viewBox="0 0 1260 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="text to vector transformation branching diagram">
<defs><marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#23261F"/></marker></defs>

<!-- connectors (drawn first, boxes on top) -->
<line x1="120" y1="160" x2="158" y2="160" stroke="#23261F" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="310" y1="160" x2="348" y2="160" stroke="#23261F" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="460" y1="160" x2="498" y2="62" stroke="#2F5D50" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="460" y1="160" x2="498" y2="258" stroke="#A23B34" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="690" y1="60" x2="728" y2="60" stroke="#2F5D50" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="690" y1="260" x2="728" y2="260" stroke="#A23B34" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="870" y1="60" x2="908" y2="158" stroke="#2F5D50" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="870" y1="260" x2="908" y2="162" stroke="#A23B34" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="1060" y1="160" x2="1098" y2="160" stroke="#23261F" stroke-width="1.5" marker-end="url(#arrow3)"/>

<!-- branch labels -->
<text x="490" y="40" font-family="IBM Plex Mono, monospace" font-size="11" fill="#2F5D50">SPARSE PATH</text>
<text x="490" y="300" font-family="IBM Plex Mono, monospace" font-size="11" fill="#A23B34">DENSE PATH</text>

<!-- nodes -->
<g font-family="IBM Plex Mono, monospace" font-size="11" fill="#23261F" text-anchor="middle">

<rect x="10" y="130" width="110" height="60" rx="4" fill="#F1EDE1" stroke="#B9AF97"/>
